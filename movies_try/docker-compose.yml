services:

  database:
    user: neo4j:neo4j
    image: neo4j:5.26
    ports:
      - "7474:7474" # HTTP
      # - "7473:7473" # HTTPS
      - "7687:7687" # Bolt
    container_name: neo4j-movies
    # volumes:
    #   - ./data:/data
    #   - neo4j_data:/data
    #   - neo4j_logs:/logs
    #   - neo4j_import:/import
    #   - ./import:/var/lib/neo4j/import
    #   - ./neo4j/conf/apoc.conf:/var/lib/neo4j/conf/apoc.conf
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME-neo4j}/${NEO4J_PASSWORD-password}
      - NEO4J_PLUGINS=["apoc"] #,"graph-data-science"]
      # - NEO4J_server_memory_heap_initial__size=512m
      # - NEO4J_server_memory_heap_max__size=1G
      # - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_db_tx__log_rotation_retention__policy=false
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      # ,gds.*
      # - NEO4J_dbms_security_procedures_whitelist=gds.*
    # database  | ERROR: No compatible "graph-data-science" plugin found for Neo4j 5.26.4 community.
    # database  |     This can happen with the newest Neo4j versions when a compatible plugin has not yet been released.
    # database  |     You can either use an older version of Neo4j, or continue without graph-data-science.
    # database  |     Neo4j will continue to start, but "graph-data-science" will not be loaded.
    # database  | Applying default values for plugin graph-data-science to neo4j.conf
    # database  | Skipping dbms.security.procedures.unrestricted for plugin graph-data-science because it is already set.
    # database  | You may need to add gds.* to the dbms.security.procedures.unrestricted setting in your configuration file.
    # database  | Changed password for user 'neo4j'. IMPORTANT: this change will only take effect if performed before the database is started for the first time.
    healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
        interval: 15s
        timeout: 30s
        retries: 10
    restart: unless-stopped
    networks:
      - net

networks:
  net:
